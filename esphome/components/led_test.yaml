# Live LED Test button. The same button also lives in controls.yaml, but that
# file is pulled in with <<: !include, and a later button: list replaces it.
# Packages append, so this is the one that actually ends up on the chamber.
button:
  - platform: template
    name: "LED Test"
    id: led_test
    icon: mdi:led-on
    web_server:
      sorting_group_id: grp_lights
      sorting_weight: 90
    on_press:
      - script.execute: led_test_sequence
