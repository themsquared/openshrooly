# Opt-in Shroom Labs cloud pairing. Off until someone turns it on
# from the local web page (admin login). Growing does not use this path.
shroom_labs_cloud:
  id: shl_cloud
  api_host: api.shroomlabs.io
  site_origin: https://shroomlabs.io
  # Numbers the site may set in one atomic command (validated against each entity's range).
  knobs:
    air_exchange_speed: air_exchange_speed
    air_exchange_period_min: air_exchange_period_min
    air_exchange_run_sec: air_exchange_run_sec
    sunrise_hour: sunrise_hour
    light_hours: light_hours
    white_intensity: white_intensity
    color_r: color_r
    color_g: color_g
    color_b: color_b
    grow_day: grow_day
  grow_phase: grow_phase

interval:
  # Link this device: the web page's Turn on also lands here. Ticks the flow
  # once a second while the page shows and repaints only when it changes.
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              if (!id(shl_cloud)->take_show_claim() || id(icloudclaim).is_showing()) {
                return false;
              }
              id(shl_cloud)->link_open(wifi::global_wifi_component->is_connected());
              id(current_ui_page) = 8;
              id(page_just_changed) = true;
              return true;
          then:
            - lvgl.page.show: icloudclaim
      - if:
          condition:
            lambda: 'return id(icloudclaim).is_showing();'
          then:
            - lambda: |-
                const auto act = id(shl_cloud)->link_tick(wifi::global_wifi_component->is_connected());
                if (act == shroom_labs::LinkAction::GoGrow) {
                  id(current_ui_page) = 0;
                  id(page_just_changed) = true;
                } else if (act == shroom_labs::LinkAction::GoMenu) {
                  id(menu_selection) = 0;
                  id(current_ui_page) = 1;
                  id(page_just_changed) = true;
                }
            - if:
                condition:
                  lambda: 'return id(current_ui_page) == 0 && id(page_just_changed);'
                then:
                  - lambda: 'id(page_just_changed) = false;'
                  - lvgl.page.show: aaaa
                  - script.execute: update_growing_screen
                  - component.update: my_display
            - if:
                condition:
                  lambda: 'return id(current_ui_page) == 1 && id(page_just_changed);'
                then:
                  - lambda: 'id(page_just_changed) = false;'
                  - lvgl.page.show: bsettingsmenu
                  # Button 0 does nothing; it just repaints the menu labels.
                  - script.execute:
                      id: ui_navigation_handler
                      button: 0
            - if:
                condition:
                  lambda: 'return id(icloudclaim).is_showing() && id(shl_cloud)->link_take_dirty();'
                then:
                  - script.execute: update_cloud_screen
                  - component.update: my_display
