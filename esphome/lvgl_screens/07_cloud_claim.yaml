# ========================================================================
# LINK THIS DEVICE - big claim code + QR, glanceable like the grow screen
# Canvas is 296x128. Hero type for the code, QR on the right. The QR canvas
# comes before the labels so wide messages draw over the blank canvas.
# The last four children must stay the button bar (apply_display_layout).
# ========================================================================

- id: icloudclaim
  bg_color: paper_white
  widgets:
    - canvas:
        id: claim_qr
        width: 105
        height: 105
        align: TOP_RIGHT
        x: -4
        y: 2

    - image:
        id: claim_header_mark
        src: mark_16
        align: TOP_LEFT
        x: 5
        y: 3
        image_recolor: paper_black
        image_recolor_opa: COVER

    - label:
        id: claim_title
        text: "Link"
        align: TOP_LEFT
        x: 25
        y: 0
        text_font: font_ui

    - label:
        id: claim_code_label
        text: ""
        align: TOP_LEFT
        x: 6
        y: 26
        text_font: font_hero

    - label:
        id: claim_hint
        text: ""
        align: TOP_LEFT
        x: 6
        y: 78
        width: 182
        long_mode: WRAP
        text_font: font1

    - obj:
        x: 0
        y: 107
        width: 73
        height: 20
        radius: 0
        border_width: 0
        bg_color: paper_black
        widgets:
          - label:
              id: claim_back_label
              text: "Back"
              align: CENTER
              text_color: paper_white
              text_font: font1
    - obj:
        x: 75
        y: 107
        width: 73
        height: 20
        radius: 0
        border_width: 0
        bg_color: paper_black
        widgets:
          - label:
              text: ""
              align: CENTER
              text_color: paper_white
              text_font: font1
    - obj:
        x: 150
        y: 107
        width: 73
        height: 20
        radius: 0
        border_width: 0
        bg_color: paper_black
        widgets:
          - label:
              text: ""
              align: CENTER
              text_color: paper_white
              text_font: font1
    - obj:
        x: 225
        y: 107
        width: 71
        height: 20
        radius: 0
        border_width: 0
        bg_color: paper_black
        widgets:
          - label:
              id: claim_next_label
              text: ""
              align: CENTER
              text_color: paper_white
              text_font: font1
