# ========================================================================
# MAIN SCREEN - Across-the-room growing status
# Display-only layout on top of upstream climate / light / FAE / water
# entities. Select (button 4) still opens the settings menu.
# Canvas is 296x128 after LVGL rotation 90 (Waveshare 2.90inv2-r2).
# Type: 24x48 heroes, 12x24 clock, 6x12 stage / status.
# ========================================================================

- id: aaaa
  bg_color: paper_white
  widgets:
    - label:
        id: main_time_label
        text: "--:--"
        align: TOP_LEFT
        x: 5
        y: 2
        text_font: font_ui

    - label:
        id: grow_phase_label
        text: "Idle"
        align: TOP_RIGHT
        x: -5
        y: 8
        text_font: font1

    - label:
        id: main_temp_value
        text: "--.-C"
        align: TOP_LEFT
        x: 6
        y: 28
        text_font: font_hero

    - label:
        id: main_humidity_value
        text: "--%"
        align: TOP_LEFT
        x: 218
        y: 28
        text_font: font_hero

    - label:
        id: grow_next_event
        text: ""
        align: TOP_LEFT
        x: 5
        y: 80
        text_font: font1

    - obj:
        id: grow_alert_bar
        x: 0
        y: 78
        width: 296
        height: 24
        bg_color: paper_black
        radius: 0
        pad_all: 0
        hidden: true
        widgets:
          - label:
              id: grow_alert_text
              text: ""
              align: CENTER
              text_color: paper_white
              text_font: font_ui

    # Kept so apply_display_layout can skip it when flipping the panel.
    - label:
        id: main_status_message
        text: "Join OpenShrooly, then 192.168.4.1"
        align: TOP_LEFT
        x: 5
        y: 110
        text_font: font1

    # Button 4: same size and place as upstream so navigation stays identical.
    - obj:
        x: 224
        y: 107
        width: 71
        height: 20
        bg_color: paper_black
        widgets:
          - label:
              text: "Select"
              align: CENTER
              text_color: paper_white
              text_font: font1
