# ========================================================================
# MAIN SCREEN - Across-the-room growing status
# Display-only layout on top of upstream climate / light / FAE / water
# entities. Select (button 4) still opens the settings menu.
# Canvas is 296x128 after LVGL rotation 90 (Waveshare 2.90inv2-r2).
# Keep content in y=0..104 so apply_display_layout's 20px flip still fits.
# ========================================================================

- id: aaaa
  bg_color: paper_white
  widgets:
    - image:
        id: grow_mark
        src: mark_16
        x: 4
        y: 2

    - label:
        id: main_time_label
        text: "--:--"
        align: TOP_LEFT
        x: 22
        y: 2
        text_font: font_ui

    - label:
        id: grow_phase_label
        text: "Idle"
        align: TOP_RIGHT
        x: -5
        y: 2
        text_font: font_ui

    - obj:
        id: grow_progress_track
        x: 5
        y: 20
        width: 286
        height: 6
        bg_color: paper_white
        border_color: paper_black
        border_width: 1
        radius: 0
        pad_all: 0
        hidden: true
        widgets:
          - obj:
              id: grow_progress_fill
              x: 0
              y: 0
              width: 1
              height: 6
              bg_color: paper_black
              border_width: 0
              radius: 0
              pad_all: 0

    - label:
        id: main_temp_value
        text: "--.-"
        align: TOP_LEFT
        x: 8
        y: 30
        text_font: font_hero

    - label:
        id: grow_temp_unit
        text: "C"
        align: TOP_LEFT
        x: 76
        y: 46
        text_font: font_ui

    - label:
        id: main_humidity_value
        text: "--"
        align: TOP_LEFT
        x: 160
        y: 30
        text_font: font_hero

    - label:
        id: grow_rh_unit
        text: "%"
        align: TOP_LEFT
        x: 212
        y: 46
        text_font: font_ui

    - label:
        id: grow_temp_meta
        text: "tgt --"
        align: TOP_LEFT
        x: 8
        y: 66
        text_font: font1

    - label:
        id: grow_humidity_meta
        text: "tgt --"
        align: TOP_LEFT
        x: 160
        y: 66
        text_font: font1

    - label:
        id: grow_next_event
        text: ""
        align: TOP_LEFT
        x: 5
        y: 78
        text_font: font1

    - obj:
        id: grow_alert_bar
        x: 0
        y: 90
        width: 296
        height: 14
        bg_color: paper_black
        radius: 0
        pad_all: 0
        hidden: true
        widgets:
          - label:
              id: grow_alert_text
              text: ""
              align: CENTER
              text_color: paper_white
              text_font: font_ui

    # Kept so apply_display_layout can skip it when flipping the panel.
    - label:
        id: main_status_message
        text: ""
        align: BOTTOM_LEFT
        x: 5
        y: -5
        text_font: font1
        hidden: true

    # Button 4: same size and place as upstream so navigation stays identical.
    - obj:
        x: 224
        y: 107
        width: 71
        height: 20
        bg_color: paper_black
        widgets:
          - label:
              text: "Select"
              align: CENTER
              text_color: paper_white
              text_font: font1
