# ========================================================================
# BOOT SPLASH - 1-bit mushroom mark, wordmark, then the growing screen
# Display only. Shown for 2s after LVGL is ready; SWD timing is unchanged.
# Positions match scripts/render_epaper_previews.py (SPLASH_*_Y).
# ========================================================================

- id: splash
  bg_color: paper_white
  widgets:
    - image:
        id: splash_logo_widget
        src: splash_logo
        align: TOP_MID
        y: 4

    - label:
        text: "OpenShrooly"
        align: TOP_MID
        y: 70
        text_font: font_ui

    - label:
        text: "by Shroom Labs"
        align: TOP_MID
        y: 100
        text_font: font1
