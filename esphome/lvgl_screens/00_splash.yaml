# ========================================================================
# BOOT SPLASH - 1-bit logo, then the growing screen
# Display only. Shown for 2s after LVGL is ready; SWD timing is unchanged.
# ========================================================================

- id: splash
  bg_color: paper_white
  widgets:
    - image:
        id: splash_logo_widget
        src: splash_logo
        align: TOP_MID
        y: 12

    - label:
        text: "OpenShrooly"
        align: BOTTOM_MID
        y: -20
        text_font: font_ui
