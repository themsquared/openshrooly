substitutions:
  device_version: "1.0.3-sl.5"

esphome:
  name: openshrooly
  name_add_mac_suffix: true
  friendly_name: OpenShrooly
  project:
    name: grahamsz.openshrooly
    version: ${device_version}
  build_flags:
    - -Wno-cpp  # Suppress preprocessor warnings (including deprecation warnings)

  on_boot:
    priority: 600  # Very early boot
    then:
      # Reapply the restored IANA timezone through the normal select callback.
      - lambda: |-
          id(timezone).publish_state(id(timezone).current_option().c_str());

      # Start SWD programming immediately
      - lambda: |-
          ESP_LOGI("boot", "Starting SWD programming early...");
      - swd_programmer.program: swd

      # Wait 3 seconds for SWD to get going, then LVGL will initialize
      - delay: 3s

      - lambda: |-
          id(display_ready) = true;
          ESP_LOGI("boot", "LVGL initialized; applying display orientation and layout...");
      - lvgl.display.set_rotation:
          rotation: !lambda |-
            return id(flip_screen).state ? 270 : 90;
      - script.execute:
          id: apply_display_layout
          flipped: !lambda 'return id(flip_screen).state;'

      # Splash is display-only. SWD still finishes 5s after LVGL is ready.
      - delay: 200ms
      - lambda: |-
          ESP_LOGI("boot", "Showing splash, then growing screen...");
      - lvgl.page.show: splash
      - delay: 100ms
      - component.update: my_display
      - delay: 2s
      - lvgl.page.show: aaaa
      - delay: 100ms
      - script.execute: update_growing_screen
      - component.update: my_display

      # Wait for SWD programming to complete (typically takes 5-7 seconds total)
      - delay: 3s
      - lambda: |-
          ESP_LOGI("boot", "SWD programming should be complete, starting fan control...");
          // The RP2040 restarts with its humidifier output at 0%. Discard any
          // control state produced by sensor callbacks while it was programming.
          id(humidifier_on_flag) = false;
          id(humidifier_command_duty) = 0;
          id(humidifier_command_succeeded) = false;
          id(coprocessor_ready) = true;

      # Continue with normal boot sequence
      - script.stop: fan_rpm_check
      - script.stop: fan_stop_check
      - script.execute: air_exchange_manager

      # Restart WiFi AP after 5 seconds to ensure DHCP server is running
      - delay: 5s
      - script.execute: wifi_ap_bounce
      - script.wait: wifi_ap_bounce
      - delay: 4s
      - script.execute: wifi_ap_boot_verify

      # Wait until humidity is valid
      - wait_until:
          condition:
            lambda: 'return !isnan(id(humidity).state);'
          timeout: 30s

      # Start humidity control
      - lambda: |-
          ESP_LOGI("boot", "🌊 Humidity sensor ready, starting humidity control manager");
      - script.execute: humidity_control_manager

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: arduino

logger:
  level: INFO


api:
  reboot_timeout: 0s
  # Each chamber makes its own key on first boot. See docs/SECURITY.md.
  encryption: {}

# No "ota: platform: esphome": it installs files without checking who made them.
# Updates come through the web page (signed files only) or USB.

# Listed deviations from grahamsz/openshrooly: recovery after a bad OTA,
# and USB serial Wi-Fi provisioning for the browser installer.
safe_mode:

improv_serial:

external_components:
  - source:
      type: local
      path: external_components
# LVGL is now a native component in ESPHome 2024.8.0+

wifi:
  # The setup network only runs in Wi-Fi setup mode, with this chamber's own
  # name and password (set by device_security). It never starts by itself
  # when the home network drops.
  ap:
    ap_timeout: 0s
    manual_ip:
      static_ip: 192.168.4.1
      gateway: 192.168.4.1
      subnet: 255.255.255.0

  on_connect:
    then:
      - lambda: |-
          id(ap_status_text) = "Wi-Fi connected";
      - component.update: my_display

  on_disconnect:
    then:
      - if:
          condition:
            lambda: 'return id(device_sec)->in_setup();'
          then:
            - script.execute: wifi_ap_bounce

captive_portal:

# Include text sensors early so scripts can reference them
<<: !include components/text_sensors.yaml

# Scripts will be loaded after components to ensure all IDs are available

interval:
  # Water level check interval (every 30 seconds)
  - interval: 1s
    then:
      - script.execute: lighting_control_manager

  - interval: 60s
    then:
      - lambda: |-
          auto t = id(sntp_time).now();
          if (t.is_valid()) {
            ESP_LOGI("time",
              "Local time: %04d-%02d-%02d %02d:%02d:%02d",
              t.year, t.month, t.day_of_month,
              t.hour, t.minute, t.second
            );
          } else {
            ESP_LOGW("time", "SNTP time not valid yet");
          }


  - interval: 30s # Every 30 seconds, run the water level calculator
    then:
      - script.execute: water_level_calculator          

  # Keep the ESP32 and coprocessor outputs reconciled. This also recovers the
  # humidifier automatically if the coprocessor restarts or misses a command.
  - interval: 15s
    then:
      - if:
          condition:
            lambda: |-
              return id(coprocessor_ready) && id(humidifier_on_flag);
          then:
            - script.execute:
                id: humidifier_pwm_control
                requested_duty: !lambda 'return id(humidifier_speed).state;'

  # Watchdog: nudge SoftAP/DHCP if the STA link stays down
  - interval: 45s
    then:
      - lambda: |-
          const uint32_t now = millis();

          if (wifi::global_wifi_component->is_connected() || !id(device_sec)->in_setup()) {
            return;
          }

          if (id(ap_restart_in_progress)) {
            ESP_LOGD("wifi", "AP restart in progress; watchdog skipping.");
            return;
          }

          auto ap_ip = wifi::global_wifi_component->wifi_soft_ap_ip();
          const uint32_t elapsed = now - id(ap_last_restart_ms);
          const bool ip_expected = ap_ip == network::IPAddress(192, 168, 4, 1);

          if (ip_expected) {
            return;
          }

          if (elapsed < 30000) {
            char ap_ip_str[network::IP_ADDRESS_BUFFER_SIZE];
            ap_ip.str_to(ap_ip_str);
            ESP_LOGI(
              "wifi",
              "SoftAP IP %s seen %ums after last restart; waiting before retry.",
              ap_ip_str,
              static_cast<unsigned int>(elapsed)
            );
            return;
          }

          char ap_ip_str[network::IP_ADDRESS_BUFFER_SIZE];
          ap_ip.str_to(ap_ip_str);
          ESP_LOGW(
            "wifi",
            "SoftAP IP unhealthy (%s); re-running restart helper.",
            ap_ip_str
          );

          id(wifi_ap_bounce).execute();

  # Partial refresh of the growing screen. Cadence matches upstream (10s).
  # full_update_every: 300 on the Waveshare panel is unchanged.
  - interval: 10s
    then:
      - script.execute: update_growing_screen
      - component.update: my_display


<<: !include components/globals.yaml
<<: !include components/alerts_simple.yaml

# Scripts loaded immediately after alerts to ensure button IDs are available
script: !include_dir_merge_list scripts/

<<: !include components/calibration.yaml
<<: !include components/selects.yaml
<<: !include components/controls.yaml
<<: !include components/time.yaml
<<: !include components/communication.yaml
<<: !include components/outputs.yaml
<<: !include components/sensors.yaml
<<: !include components/display.yaml
<<: !include components/buttons.yaml
<<: !include components/lvgl_config.yaml
<<: !include components/webserver.yaml

# Signed software updates (see components/updates.yaml). A package, not a
# '<<' merge, so its buttons and switch are added to the existing lists.
packages:
  updates: !include components/updates.yaml
  security: !include components/security.yaml
  daily_range: !include components/daily_range.yaml
  cloud: !include components/cloud.yaml
