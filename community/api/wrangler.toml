name = "openshrooly-community-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Replace database_id after: npx wrangler d1 create openshrooly
[[d1_databases]]
binding = "DB"
database_name = "openshrooly"
database_id = "00000000-0000-0000-0000-000000000001"

# Replace bucket after: npx wrangler r2 bucket create openshrooly-photos
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "openshrooly-photos"

[vars]
SITE_NAME = "OpenShrooly Community"
SHOW_PSILOCYBIN = "1"
# Public Netlify origin allowed to call this API with Authorization headers.
CORS_ORIGIN = "http://127.0.0.1:8888"

# Secrets (do not put live payment keys here):
#   npx wrangler secret put COMMUNITY_SECRET
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET   # unused stub
