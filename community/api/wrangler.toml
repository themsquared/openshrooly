name = "shroom-labs-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Replace database_id after: npx wrangler d1 create shroomlabs
[[d1_databases]]
binding = "DB"
database_name = "shroomlabs"
database_id = "00000000-0000-0000-0000-000000000001"

# Replace bucket after: npx wrangler r2 bucket create shroomlabs-media
# Attach a public custom domain cdn.shroomlabs.io to this bucket in the dashboard.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "shroomlabs-media"

[vars]
SITE_NAME = "Shroom Labs"
SHOW_PSILOCYBIN = "1"
# Browser origins allowed to call api.shroomlabs.io with Authorization headers.
CORS_ORIGIN = "https://shroomlabs.io,https://www.shroomlabs.io,http://127.0.0.1:8888,http://localhost:8888"
# Public R2 custom domain for grow-report photos.
CDN_BASE_URL = "https://cdn.shroomlabs.io"

# Custom API hostname (enable after shroomlabs.io DNS is on Cloudflare):
# [[routes]]
# pattern = "api.shroomlabs.io/*"
# zone_name = "shroomlabs.io"

# Secrets (do not put live payment keys here):
#   npx wrangler secret put COMMUNITY_SECRET
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET   # unused stub
