[build]
  command = "node scripts/write-config.js && node scripts/generate-seo.js"
  publish = "public"

# Serve the HTML exactly as committed. Netlify would otherwise rewrite
# /faq.html links to /faq, which no longer match the canonical URLs and sitemap.
[build.processing.html]
  pretty_urls = false

[build.environment]
  NODE_VERSION = "20"
  # Production defaults. Override in the Netlify UI if needed.
  API_BASE_URL = "https://api.shroomlabs.io"
  MEDIA_BASE_URL = "https://cdn.shroomlabs.io"
  TURNSTILE_SITE_KEY = "0x4AAAAAAFjd0Rzec6mAd5y6"

# Custom domain: shroomlabs.io (and www.shroomlabs.io → apex) in the Netlify UI.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://api.shroomlabs.io wss://api.shroomlabs.io http://127.0.0.1:8787 http://localhost:8787 ws://127.0.0.1:8787 ws://localhost:8787 https://cdn.shroomlabs.io https://challenges.cloudflare.com; img-src 'self' data: blob: https://cdn.shroomlabs.io; style-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; script-src 'self' https://challenges.cloudflare.com; font-src 'self'; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://api.shroomlabs.io http://127.0.0.1:8787"

[[headers]]
  for = "/install.html"
  [headers.values]
    # The installer loads ESP Web Tools from this site and hands it the checked
    # image as an in-page blob. Nothing is loaded from other sites.
    Content-Security-Policy = "default-src 'self'; connect-src 'self' blob: https://api.shroomlabs.io; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/firmware/*"
  [headers.values]
    # Release info must never be served stale from a cache.
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/profiles/:id"
  to = "/profile.html?id=:id"
  status = 200
