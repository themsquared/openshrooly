[build]
  command = "node scripts/write-config.js"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"
  # Set API_BASE_URL in the Netlify UI to the Cloudflare Worker origin,
  # e.g. https://openshrooly-community-api.workers.dev

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/profiles/:id"
  to = "/profile.html?id=:id"
  status = 200
