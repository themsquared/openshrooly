name: Hub and community tests

on:
  pull_request:
    branches: [main, cursor/community-platform-fa9c]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  python:
    name: Profile lib + hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt -r hub/requirements.txt
      - name: Test
        env:
          PYTHONPATH: shared:.
        run: python -m pytest -q

  community-api:
    name: Community API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: community/api/package-lock.json
      - name: Install
        working-directory: community/api
        run: npm ci
      - name: Test
        working-directory: community/api
        run: npm test

  community-web:
    name: Community web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: community/web/package-lock.json
      - name: Install
        working-directory: community/web
        run: npm ci
      - name: Test
        working-directory: community/web
        env:
          CHROME_PATH: /usr/bin/google-chrome-stable
        run: npm test
