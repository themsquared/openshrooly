# Local hub + (optional) community API/web are usually run with Python/Node.
# This file is the Pi-friendly hub container only.
services:
  hub:
    build:
      context: .
      dockerfile: hub/Dockerfile
    ports:
      - "8090:8090"
    environment:
      HUB_ENABLE_PSILOCYBIN: "0"
      COMMUNITY_URL: ${COMMUNITY_URL:-https://api.shroomlabs.io}
      COMMUNITY_TOKEN: ${COMMUNITY_TOKEN:-}
    volumes:
      - hub-data:/app/hub/data
volumes:
  hub-data:
