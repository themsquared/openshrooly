# Local hub and the Matter bridge sidecar.
# Both use host networking so the hub can reach the status server on 127.0.0.1.
# The status server also writes /shared/status.json on a volume the hub can read
# if someone runs the hub without host networking. It does not listen on the LAN.
#
# The bridge service is Linux-only (compose profile "linux"). Matter needs real
# host multicast. Docker Desktop on macOS cannot advertise Matter from a container.
# On a Mac mini, run the bridge with Node on the host. See docs/SMART_HOME.md
# and scripts/macos/.
#
# Linux: docker compose --profile linux up
# macOS: docker compose up hub   # then scripts/macos/run-matter-bridge.sh
services:
  hub:
    build:
      context: .
      dockerfile: hub/Dockerfile
    network_mode: host
    environment:
      HUB_ENABLE_PSILOCYBIN: "0"
      COMMUNITY_URL: ${COMMUNITY_URL:-https://api.shroomlabs.io}
      COMMUNITY_TOKEN: ${COMMUNITY_TOKEN:-}
      HUB_ADMIN_PASSWORD: ${HUB_ADMIN_PASSWORD:-}
      HUB_ALLOWED_HOSTS: ${HUB_ALLOWED_HOSTS:-}
      BRIDGE_STATUS_URL: http://127.0.0.1:8091
      BRIDGE_STATUS_FILE: /shared/status.json
    volumes:
      - hub-data:/app/hub/data
      - bridge-status:/shared:ro

  bridge:
    profiles:
      - linux
    build:
      context: .
      dockerfile: bridge/Dockerfile
    network_mode: host
    environment:
      HUB_URL: ${HUB_URL:-http://127.0.0.1:8090}
      BRIDGE_STATUS_PORT: "8091"
      BRIDGE_STATUS_BIND: "127.0.0.1"
      BRIDGE_STATUS_FILE: /shared/status.json
      MATTER_STORAGE_PATH: /data
      MATTER_LOG_LEVEL: warn
    volumes:
      - bridge-data:/data
      - bridge-status:/shared
    depends_on:
      - hub

volumes:
  hub-data:
  bridge-data:
  bridge-status:
